<div class="conteiner">
    <h1>Lista de compras</h1>

    <form #frm="ngForm" class="add-item-form" (ngSubmit)="adicionarItem()">
        <input 
            type="text" 
            id="item" 
            name="item"
            [(ngModel)]="item" 
            placeholder="Digite o nome do item" 
        />
        <button type="submit">Adicionar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Item</th>
                <th>Comprado</th>
            </tr>
        </thead>
        <tbody>
            @for (elemento of lista; track elemento.id) {
                <tr>
                    <td>{{elemento.id}}</td>
                    <td>{{elemento.nome}}</td>
                    <td>
                        <input type="checkbox" />
                    </td>
                </tr>
            } @empty {
                <tr>
                    <td colspan="3">Nenhum item adicionado</td>
                </tr>
            }
        </tbody>
    </table>
</div>
